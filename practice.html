<h2>اليوم 1: من التشخيص إلى الأدوار والمديرين</h2>
<ol>
<li><p>في إدارة أخرى، لوحة المساعد المعتمد لفريق الاتصال المؤسسي: 72% نشطون أسبوعيًّا، و6 جلسات لكل نشط. تريد أن تعرف هل الاستخدام سطحي. أي دليل تطلب؟</p><ul><li><b>أ.</b> عدد الجلسات الكلي في الربع، وعدد من فتح المساعد مرة واحدة على الأقل</li><li><b>ب.</b> طول الجلسات، ونسبة من يقول في الاستبانة إنه يتحقق من المخرج دائمًا</li><li><b>ج.</b> متوسط رضا الفريق عن المساعد من 1 إلى 5</li><li><b>د.</b> الوقت الذي يقول الموظفون في الاستبانة إنهم وفّروه كل أسبوع بالمساعد</li></ul></li>
<li><p>تكتب نواتج إلمام لموظفي العلاقات العامة في جهة أخرى. أي صياغة تصلح ناتجًا له فحص؟</p><ul><li><b>أ.</b> يعي مخاطر إدخال البيانات في أدوات الذكاء الاصطناعي</li><li><b>ب.</b> يستخدم المساعد المعتمد في إعداد منشور واحد كل أسبوع على الأقل</li><li><b>ج.</b> يوقّع إقرارًا بأنه قرأ قواعد استخدام الذكاء الاصطناعي في الجهة</li><li><b>د.</b> يصوغ بالمساعد منشورًا من بيان صحفي منشور، ويطابق كل رقم واسم فيه بالبيان قبل نشره</li></ul></li>
<li><p>وحدة الترجمة في جهة أخرى تريد حافزًا لاستعمال المساعد المعتمد. أي خيار تختار؟</p><ul><li><b>أ.</b> هدف اختياري: مهمة متكررة يُقاس وقتها وجودتها قبل وبعد بعينة مراجَعة</li><li><b>ب.</b> خطاب شكر شهري لأكثر خمسة موظفين استعمالًا للمساعد</li><li><b>ج.</b> هدف لكل مدير: 90% من فريقه نشطون في المساعد، ويدخل في تقييم أدائه السنوي</li><li><b>د.</b> مكافأة لمن يذكر في استبانة الربع أنه وفّر أكثر من ساعتين أسبوعيًّا</li></ul></li>
<li><p>في الشؤون القانونية بجهة أخرى: 9% نشطون في المساعد المعتمد، و14 محاولة أسبوعيًّا لكل 10 موظفين إلى مواقع ذكاء اصطناعي عامة حجبتها الشبكة. أي قراءة تسندها هذه البيانات؟</p><ul><li><b>أ.</b> الاستخدام قليل في الوحدة، فالخطر على بياناتها من الذكاء الاصطناعي قليل أيضًا</li><li><b>ب.</b> المساعد المعتمد معطل في الوحدة، والحل فتح الوصول إليه</li><li><b>ج.</b> موظفون يحاولون العمل بأدوات غير معتمدة، ويلزم مصدر ثانٍ لمعرفة السبب</li><li><b>د.</b> الوحدة لا تحتاج الذكاء الاصطناعي في عملها، فلا إجراء مطلوب</li></ul></li>
<li><p>فريق من 30 موظفًا في إدارة أخرى: 4 نشطون في المساعد، و16 جلسة لكل نشط في الأسبوع. ماذا يعني الرقم 16 هنا؟</p><ul><li><b>أ.</b> أن قلة تحمل الاستخدام والأغلبية لا تستخدمه</li><li><b>ب.</b> أن الفريق كله يستخدم المساعد بكثافة</li><li><b>ج.</b> أن الاستخدام سطحي لأن الجلسات كثيرة</li><li><b>د.</b> أن المساعد بطيء فيعيد الموظفون فتح الجلسات</li></ul></li>
<li><p>تريد أن تتأكد أن عائق فريق هو المهارة والأمثلة، لا الوصول ولا القاعدة. أي دليلين معًا يسندان ذلك؟</p><ul><li><b>أ.</b> رفض وصول متكرر في الشبكة، ونسبة نشطين منخفضة</li><li><b>ب.</b> أسئلة «هل يجوز» في مكتب الدعم، وقاعدة غير واضحة في الاستبانة</li><li><b>ج.</b> إجابة «لا وقت» في الاستبانة، وقلة يحملون الاستخدام</li><li><b>د.</b> جلسات قصيرة بطلب واحد، وتذاكر «كيف أفعل» في مكتب الدعم</li></ul></li>
<li><p>تكتب ناتج إلمام لرؤساء الأقسام في جهة أخرى. أي ناتج يخص المدير ويُفحص؟</p><ul><li><b>أ.</b> يدرك أهمية حوكمة الذكاء الاصطناعي في قسمه</li><li><b>ب.</b> يكتب بالمساعد ردودًا على المستفيدين كما يكتبها موظفو قسمه</li><li><b>ج.</b> يقرر هل تُضاف مهمة جديدة إلى قائمة القسم المسموحة، بمستوى تصنيف مدخلاتها</li><li><b>د.</b> يحضر ورشة عن الذكاء الاصطناعي كل ربع سنة</li></ul></li>
<li><p>فحص للموظفين: تصحيح أخطاء في ملخص مقابل لائحة منشورة. جرّبته على مساعد مستضاف وحده فاجتازه كاملًا. ماذا تفعل بالفحص؟</p><ul><li><b>أ.</b> تعتمده كما هو، فاجتياز المساعد دليل على وضوحه</li><li><b>ب.</b> تعدّله حتى يُظهر الموظف ما تحقق منه بنفسه</li><li><b>ج.</b> تلغيه وتكتفي بإقرار مكتوب من الموظف بأنه راجع</li><li><b>د.</b> تطيله بأخطاء أكثر من النوع نفسه</li></ul></li>
<li><p>تبني نواتج لكل الأدوار على البطاقة AP-AM. أي عمل لا تغطيه البطاقة ويبقى للمختصين؟</p><ul><li><b>أ.</b> مقارنة إجابة المساعد بمصدر رسمي</li><li><b>ب.</b> الإفصاح عن الاستعانة بالذكاء الاصطناعي</li><li><b>ج.</b> تقييم مخاطر نظام ذكاء اصطناعي قبل اعتماده</li><li><b>د.</b> إيقاف استعمال مخرج يبدو قديمًا أو متحيزًا أو مخالفًا للحقائق</li></ul></li>
<li><p>لأن البطاقة AP-AM حد أدنى لجميع المختصين، تكفي نواتج إلمام واحدة لكل الأدوار في الجهة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أي صياغة لقاعدة البيانات يستطيع موظف المشتريات في جهة أخرى اتباعها؟</p><ul><li><b>أ.</b> استخدم الذكاء الاصطناعي بحذر، وبما لا يخالف الأنظمة والتعليمات المعمول بها في الجهة</li><li><b>ب.</b> يُسمح بإدخال العقود في المساعد الذي تستضيفه الجهة لأنه داخلي، ويُمنع في الأدوات العامة</li><li><b>ج.</b> تجنب البيانات الحساسة والشخصية عند استعمال أي مساعد ذكي، واستشر مديرك عند الحاجة</li><li><b>د.</b> لا يدخل المساعد المعتمد إلا ما صُنف «عامًّا»، ولا يدخل أي أداة «المقيد» فأعلى، وعند الشك يُسأل مالك البيانات</li></ul></li>
<li><p>حافز مقترح في جهة أخرى: مكافأة الفريق الذي يحفظ أكثر الطلبات في المكتبة المشتركة. ما أثره الجانبي الأرجح؟</p><ul><li><b>أ.</b> نسخ متشابهة كثيرة لا يراجعها أحد</li><li><b>ب.</b> انخفاض عدد الطلبات المحفوظة في المكتبة</li><li><b>ج.</b> ارتفاع جودة الطلبات بسبب المنافسة بين الفرق</li><li><b>د.</b> توقف الفريق عن استعمال المساعد المعتمد</li></ul></li>
<li><p>مدير وحدة في جهة أخرى يقول: «شجعت فريقي برسالة، ولم يتغير شيء». ما الذي ينقصه أكثر من غيره؟</p><ul><li><b>أ.</b> رسالة تشجيع ثانية من الإدارة العليا</li><li><b>ب.</b> ترتيب لموظفيه بحسب عدد جلساتهم في المساعد، يُعرض في اجتماع القسم</li><li><b>ج.</b> ترخيص لمساعد أقوى من المساعد المعتمد</li><li><b>د.</b> وقت محمي في الجدول، وإذن مكتوب، ومثال من عمل الفريق</li></ul></li>
<li><p>أي سطر إفصاح يفي بالغرض في تقرير أعده موظف بمساعدة المساعد المعتمد؟</p><ul><li><b>أ.</b> أُعدّ هذا التقرير بالذكاء الاصطناعي</li><li><b>ب.</b> أعد المساعد المسودة، وراجعتُ كل رقم مقابل الجدول المنشور</li><li><b>ج.</b> المساعد المعتمد مسؤول عن أي خطأ يظهر في أرقام هذا التقرير</li><li><b>د.</b> لا يُنشر هذا التقرير ولا يُتداول</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: القياس ثم القرار</h2>
<ol>
<li><p>فريق العلاقات العامة في جهة أخرى يسأل مكتب الدعم: «هل يجوز أن أُدخل في المساعد المعتمد بيانًا صحفيًّا قبل نشره؟». أي بطاقة تجيبه وحدها؟</p><ul><li><b>أ.</b> استخدم المساعد بحذر، وتجنب المعلومات الحساسة</li><li><b>ب.</b> لا يُدخل في المساعد أي نص من أعمال الجهة، منشورًا كان أو غير منشور</li><li><b>ج.</b> يدخل ما صُنف «عامًّا»، والبيان قبل نشره يتبع تصنيفه، فاسأل مالكه</li><li><b>د.</b> كل شيء يدخل المساعد ما دامت الجهة تستضيفه</li></ul></li>
<li><p>في جهة أخرى، وسيط زمن رد مكتوب في وحدة استعملت المساعد نزل من 40 إلى 30 دقيقة، وجودته ثابتة. وفي وحدة مقارنة لم تستعمله نزل من 44 إلى 40.92 دقيقة. ماذا تكتب في اللوحة؟</p><ul><li><b>أ.</b> نحو 18 نقطة لصالح الوحدة، والجودة ثابتة</li><li><b>ب.</b> 25% أسرع بفضل المساعد</li><li><b>ج.</b> لا أثر: الوحدتان تحسنتا معًا</li><li><b>د.</b> نحو 32 نقطة: مجموع تغير الوحدة وتغير المقارنة</li></ul></li>
<li><p>وحدة استخدمت المساعد: وسيط زمن مهمة مشتركة نزل من 50 إلى 40 دقيقة. وحدة مقارنة لم تستخدمه: من 45 إلى 40.5 دقيقة، بعد نموذج عمل جديد وُزع على الجميع. كم يُنسب إلى المساعد تقريبًا؟</p><ul><li><b>أ.</b> 20 نقطة مئوية: التغير كله في الوحدة المستخدمة</li><li><b>ب.</b> 30 نقطة مئوية: مجموع التغيرين</li><li><b>ج.</b> 10 نقاط مئوية: الفرق بين التغيرين</li><li><b>د.</b> لا شيء: الوحدتان تحسنتا معًا</li></ul></li>
<li><p>قاعدة لوحة في جهة أخرى: لا رقم عن مجموعة أقل من 5. في خلية المهارة: 4 أدوا الفحص واجتاز 3. ماذا تعرض؟</p><ul><li><b>أ.</b> 75%</li><li><b>ب.</b> 3 من 4</li><li><b>ج.</b> أسماء الأربعة ونتائجهم ليتابعهم المدير</li><li><b>د.</b> «أقل من 5»، دون نسبة</li></ul></li>
<li><p>رئيس في جهة أخرى يطلب «مؤشر تبنٍّ» واحدًا يجمع الاستخدام والمهارة والقيمة بأوزان. ماذا تقترح؟</p><ul><li><b>أ.</b> يُجمع بأوزان متساوية، فيسهل ترتيب الفرق</li><li><b>ب.</b> تُعرض الثلاثة منفصلة، ولكل منها قرار يخدمه</li><li><b>ج.</b> يكفي الاستخدام، فالمهارة والقيمة تتبعانه</li><li><b>د.</b> تكفي القيمة، فالاستخدام والمهارة لا يهمان القيادة</li></ul></li>
<li><p>الوقت الموفَّر كما يذكره الموظفون في الاستبانة يكفي مقياسًا لقيمة المساعد.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في خطة تبنٍّ لجهة أخرى، يطلب قائد البرنامج توسيع التجربة إلى ثلاث وحدات جديدة. من يعتمد الطلب؟</p><ul><li><b>أ.</b> راعية البرنامج، أو لجنة لا يرأسها مقدم الطلب</li><li><b>ب.</b> قائد البرنامج نفسه، فهو أعرف من غيره ببيانات التجربة</li><li><b>ج.</b> أكثر السفراء نشاطًا في التجربة</li><li><b>د.</b> مورِّد الأداة، فهو أعرف بقدرتها</li></ul></li>
<li><p>تكتب نقطة قرار لوحدة تجريبية في جهة أخرى. أي صياغة تصلح نقطة قرار؟</p><ul><li><b>أ.</b> نراجع الوضع في منتصف المدة ونقرر ما نراه مناسبًا</li><li><b>ب.</b> نوسّع التجربة إلى الأقسام الأخرى إذا ارتفع عدد الجلسات الأسبوعية</li><li><b>ج.</b> نوقف التجربة فورًا إذا اشتكى منها أي موظف في الوحدة</li><li><b>د.</b> نوسّع إذا تحسن الزمن عن المقارنة دون نزول الجودة، ونصلح أولًا إن نزلت</li></ul></li>
<li><p>أي تكليف لسفير التغيير في فريقه أنسب؟</p><ul><li><b>أ.</b> يراقب استخدام زملائه في المساعد ويرفع أسماء المقصرين إلى المدير</li><li><b>ب.</b> وقت محمي، وتكليف مكتوب، وحدود دور، ومسار تصعيد</li><li><b>ج.</b> يعتمد طلبات الوصول إلى البيانات في فريقه</li><li><b>د.</b> يتطوع في وقته الخاص دون تكليف</li></ul></li>
</ol>
